<!DOCTYPE html>
<html>
  <head>
    <title>Registration</title>
    <style>
      body {
        background-color: #f2f2f2;
        font-family: Arial, sans-serif;
      }

      .container {
        width: 350px;
        margin: 100px auto; /* Centers the form */
        background: white;
        padding: 25px;
        border-radius: 10px;
        border: 2px solid #ccc;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
      }

      label {
        display: block;
        text-align: left; /* Keep labels left-aligned */
        font-weight: bold;
        margin-bottom: 5px;
      }

      input {
        width: 95%;
        padding: 8px;
        border: 1px solid #999;
        border-radius: 5px;
        margin-bottom: 15px;
      }

      button {
        width: 100%;
        padding: 10px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: #45a049;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Vehicle Registration</h2>

      <form action="/register" method="POST">
        <label>Name:</label>
        <input type="text" name="name" required />

        <label>Email:</label>
        <input type="email" name="email" required />

        <label>Number Plate:</label>
        <input type="text" name="number_plate" value="{{ plate }}" required />

        <button type="submit">Register</button>
      </form>
    </div>
  </body>
</html>
